services:
  codebridgeai:
    build: .
    container_name: codebridgeai
    ports:
      - 5000:5000
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
